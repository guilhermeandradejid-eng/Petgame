// ---------------------------------------------------------------------------------------------------
// toon shading: N.L step with a hue-shifted shadow colour, rim light, stepped speculars, inverted-hull line
// ---------------------------------------------------------------------------------------------------
const TOON_VERT = `
#include <common>
#include <skinning_pars_vertex>
varying vec3 vN; varying vec3 vV; varying vec2 vUv;
void main() {
  vUv = uv;
  #include <skinbase_vertex>
  #include <beginnormal_vertex>
  #include <skinnormal_vertex>
  #include <begin_vertex>
  #include <skinning_vertex>
  vec4 wp = modelMatrix * vec4(transformed, 1.0);
  vN = normalize(mat3(modelMatrix) * objectNormal);

}`;
const TOON_FRAG = `
uniform vec3 uBase, uShade, uLight; uniform sampler2D map; uniform vec2 uUvOff; uniform float uFlash;
varying vec3 vN; varying vec3 vV; varying vec2 vUv;
void main() {
  vec3 N = normalize(vN), V = normalize(vV), L = normalize(uLight);
  float ndl = dot(N, L), ndv = max(dot(N, V), 0.0);
  vec3 base = uBase, shade = uShade;
  #ifdef K_FACE
    base = texture2D(map, vUv + uUvOff).rgb; shade = base * vec3(0.90, 0.72, 0.74);
    float lit = smoothstep(-0.32, -0.26, ndl);
  #elif defined(K_METAL)
    float lit = smoothstep(0.20, 0.24, ndl * 0.6 + ndv * 0.4);
  #else
    float lit = smoothstep(0.02, 0.06, ndl);

    col = mix(col, vec3(1.0), smoothstep(0.93, 0.95, dot(N, normalize(L + V))) * 0.85);
  #endif
  #ifdef K_HAIR
    float zig = abs(fract(vUv.x * 2.0 - 0.5) - 0.5) * 0.10;
    float h = dot(N, normalize(V + vec3(0.0, 0.9, 0.0))) - zig;
    col = mix(col, vec3(1.0), smoothstep(0.905, 0.915, h) * (1.0 - smoothstep(0.948, 0.958, h)) * lit * 0.9);
  #endif
  #ifndef K_FACE
    float rim = smoothstep(0.66, 0.72, 1.0 - ndv) * smoothstep(0.0, 0.35, ndl) * 0.45;
    col = col + (vec3(1.0) - col) * rim;
  #endif
  #ifdef K_GLOW
    col = uBase * 1.5;
  #endif

  gl_FragColor = vec4(col, 1.0);
  #include <colorspace_fragment>
}`;
const LINE_VERT = `
#include <common>
#include <skinning_pars_vertex>
attribute vec3 onormal; uniform float uWidth;
void main() {
  #include <skinbase_vertex>
  vec3 objectNormal = onormal;
  #include <skinnormal_vertex>
  #include <begin_vertex>
  #include <skinning_vertex>
  vec4 wp = modelMatrix * vec4(transformed, 1.0);
  vec3 n = normalize(mat3(modelMatrix) * objectNormal);
  wp.xyz += n * uWidth * clamp(distance(cameraPosition, wp.xyz) / 5.0, 0.55, 2.4);
  gl_Position = projectionMatrix * viewMatrix * wp;

const LINE_FRAG = `uniform vec3 uLine; void main() { gl_FragColor = vec4(uLine, 1.0);
  #include <colorspace_fragment>
}`;
const col3 = (c) => new THREE.Color().setRGB(c[0], c[1], c[2], THREE.SRGBColorSpace);
const LINE_W = { face: 0.0016, skin: 0.0026, hair: 0.003 };

function toonMat(spec, map) {
  const defs = {};
  if (spec.kind === 'face') defs.K_FACE = 1;
  if (spec.kind === 'metal') defs.K_METAL = 1;
  if (spec.kind === 'hair') defs.K_HAIR = 1;
  if (spec.kind === 'glow') defs.K_GLOW = 1;
  return new THREE.ShaderMaterial({
    defines: defs, vertexShader: TOON_VERT, fragmentShader: TOON_FRAG,
    uniforms: { uBase: { value: col3(spec.base) }, uShade: { value: col3(spec.shade) }, uLight: { value: LIGHT },
      map: { value: map || null }, uUvOff: { value: new THREE.Vector2() }, uFlash: { value: 0 } },

}
function lineMat(color, width) {

    uniforms: { uLine: { value: col3(color) }, uWidth: { value: width } } });
}

    keys.push(k);
    const a = acc.get(k) || [0, 0, 0];
    a[0] += n.getX(i); a[1] += n.getY(i); a[2] += n.getZ(i);
    acc.set(k, a);

    const a = acc.get(keys[i]), l = Math.hypot(a[0], a[1], a[2]) || 1;
    out[i * 3] = a[0] / l; out[i * 3 + 1] = a[1] / l; out[i * 3 + 2] = a[2] / l;
  }

// ---------------------------------------------------------------------------------------------------
// world: sky, ground, standing stones, training dummies
// ---------------------------------------------------------------------------------------------------
scene.add(new THREE.Mesh(new THREE.SphereGeometry(120, 24, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  vertexShader: 'varying vec3 vD; void main(){ vD = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
  fragmentShader: `varying vec3 vD;

    float noise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
      return mix(mix(hash(i), hash(i+vec2(1,0)), f.x), mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), f.x), f.y); }
    void main(){ vec3 d = normalize(vD); float y = d.y;
      vec3 c = mix(vec3(0.914,0.953,0.965), vec3(0.612,0.784,0.949), smoothstep(0.0, 0.28, y));
      c = mix(c, vec3(0.31,0.525,0.847), smoothstep(0.2, 0.85, y));
      vec2 uv = d.xz / (y + 0.35) * 2.2; float n = noise(uv) * 0.6 + noise(uv * 2.3) * 0.3 + noise(uv * 5.1) * 0.1;
      float cl = smoothstep(0.56, 0.66, n) * smoothstep(0.02, 0.2, y) * (1.0 - smoothstep(0.6, 0.95, y));
      c = mix(c, vec3(1.0), cl * 0.92);
      gl_FragColor = vec4(c, 1.0);
      #include <colorspace_fragment>
    }`,
})));
{
  const t = document.createElement('canvas');
  t.width = t.height = 256;
  const g = t.getContext('2d');
  g.fillStyle = '#86cc68'; g.fillRect(0, 0, 256, 256);
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 90; i++) {
    g.fillStyle = ['#7cc462', '#93d573', '#74bb5c', '#a0dc7c'][i % 4];
    g.globalAlpha = 0.55;
    const x = rnd() * 256, y = rnd() * 256, r = 10 + rnd() * 26;
    for (const [ox, oy] of [[0, 0], [256, 0], [-256, 0], [0, 256], [0, -256]]) {
      g.beginPath(); g.ellipse(x + ox, y + oy, r, r * 0.55, rnd() * 3, 0, 7); g.fill();
    }
  }
  g.globalAlpha = 0.9;
  for (let i = 0; i < 60; i++) {
    g.strokeStyle = i % 3 ? '#5faa4c' : '#b6e88e'; g.lineWidth = 2;
    const x = rnd() * 256, y = rnd() * 256;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + 3, y - 9); g.moveTo(x + 4, y); g.lineTo(x + 8, y - 7); g.stroke();
  }

  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(60, 60);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  const ground = new THREE.Mesh(new THREE.CircleGeometry(120, 48), new THREE.MeshBasicMaterial({ map: tex }));
  ground.rotation.x = -Math.PI / 2;

  sh.rotation.x = -Math.PI / 2;

}
const PROP = { stone: { base: [0.80, 0.82, 0.86], shade: [0.50, 0.52, 0.66], kind: 'toon' },
  wood: { base: [0.66, 0.44, 0.26], shade: [0.40, 0.24, 0.20], kind: 'toon' },
  straw: { base: [0.95, 0.83, 0.48], shade: [0.74, 0.55, 0.30], kind: 'toon' },
  red: { base: [0.86, 0.18, 0.24], shade: [0.56, 0.08, 0.22], kind: 'toon' },
  white: { base: [0.98, 0.96, 0.90], shade: [0.76, 0.72, 0.80], kind: 'toon' } };
function prop(geo, kind, line = 0.012) {

}
{
  let s = 3;

const dummies = [];
function makeDummy(x, z) {
  const root = new THREE.Group(), tilt = new THREE.Group();
  root.position.set(x, 0, z);
  root.add(tilt);
  const add = (geo, kind, px, py, pz, rz = 0) => { const p = prop(geo, kind, 0.01); p.position.set(px, py, pz); p.rotation.z = rz; tilt.add(p); return p; };
  add(new THREE.CylinderGeometry(0.07, 0.09, 1.0, 8), 'wood', 0, 0.5, 0);
  add(new THREE.CapsuleGeometry(0.26, 0.42, 6, 14), 'straw', 0, 1.12, 0);
  add(new THREE.CylinderGeometry(0.045, 0.045, 1.05, 8), 'wood', 0, 1.28, 0, Math.PI / 2);
  add(new THREE.SphereGeometry(0.2, 14, 10), 'straw', 0, 1.72, 0);
  add(new THREE.TorusGeometry(0.265, 0.035, 8, 20), 'red', 0, 1.18, 0).rotation.x = Math.PI / 2;
  const tg = add(new THREE.CylinderGeometry(0.15, 0.15, 0.03, 20), 'white', 0, 1.15, 0.27);
  tg.rotation.x = Math.PI / 2;
  add(new THREE.CylinderGeometry(0.07, 0.07, 0.035, 16), 'red', 0, 1.15, 0.285).rotation.x = Math.PI / 2;
  const base = prop(new THREE.CylinderGeometry(0.28, 0.34, 0.1, 10), 'wood', 0.01);
  base.position.y = 0.05;
  root.add(base);
  scene.add(root);
  const mats = [];
  tilt.traverse((o) => { if (o.material && o.material.uniforms.uFlash) mats.push(o.material); });
  const d = { root, tilt, pos: root.position, ax: 0, az: 0, vx: 0, vz: 0, flash: 0, mats, punch: 0 };

// ---------------------------------------------------------------------------------------------------
// VFX: sword trail, hit sparks, shockwave ring
// ---------------------------------------------------------------------------------------------------
const TRAIL_MAX = 64, TRAIL_LIFE = 0.15;
const trailGeo = new THREE.BufferGeometry();
const tPos = new Float32Array(TRAIL_MAX * 18), tAl = new Float32Array(TRAIL_MAX * 12);

  vertexShader: 'attribute vec2 al; varying vec2 vA; void main(){ vA = al; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',

scene.add(trail);
let samples = [];
const SPARKS = 90;
const spGeo = new THREE.BufferGeometry();

spGeo.setAttribute('position', new THREE.BufferAttribute(spPos, 3).setUsage(THREE.DynamicDrawUsage));

    f.el.style.opacity = String(tmp.z > 1 ? 0 : Math.min(1, 2.2 - f.t * 2.2));
    if (f.t >= 1) { f.el.remove(); floatsArr.splice(i, 1); }
  }
}
function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight, pr = renderer.getPixelRatio();
  if (canvas.width !== Math.floor(w * pr) || canvas.height !== Math.floor(h * pr)) {
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.fov = w < h ? 46 : 34;
    camera.updateProjectionMatrix();
  }
}
const clock = new THREE.Clock();
function tick(real) {
  resize();
  if (mixer) {
    if (demo) demoStep(real);
    let scale = speed;
    if (hero.hitstop > 0) { hero.hitstop -= real; scale *= 0.03; }
    const dt = real * scale;
    logic(dt);
    const SUB = 4;
    for (let i = 0; i < SUB; i++) {
      hero.prevFrame = frame();
      mixer.update(dt / SUB);
      now += dt / SUB;
      applyRoot(dt / SUB);
      hits();
      model.position.copy(hero.pos);
      model.rotation.y = hero.yaw;
      model.updateMatrixWorld(true);
      sampleTrail(dt / SUB);
    }
    springs.step(real * Math.max(scale, 0.35));
    expression(dt);
    buildTrail();
    vfx(real * (hero.hitstop > 0 ? 0.25 : speed));
    $('meta').textContent = hero.state + '  ' + String(Math.floor(frame())).padStart(2, '0') + 'f  ·  60 fps';
    // camera follows with a critically damped lag; a little trauma-squared shake on impacts
    tmp.set(hero.pos.x, 0.95, hero.pos.z).sub(camT).multiplyScalar(1 - Math.exp(-real * 9));
    camT.add(tmp); camera.position.add(tmp); controls.target.copy(camT);
    if (demo) {
      // demo camera: side-on and slightly behind the hero, so hero and target both stay in frame
      const d = dummies[pilot.target % dummies.length];
      const want = Math.atan2(d.pos.x - hero.pos.x, d.pos.z - hero.pos.z) + 2.25;
      const off = new V3().subVectors(camera.position, controls.target);
      const az = Math.atan2(off.x, off.z), r = Math.hypot(off.x, off.z), k = 1 - Math.exp(-real * 1.25);
      const az2 = az + angDiff(want, az) * k, r2 = r + (4.9 - r) * k, y2 = off.y + (1.85 - off.y) * k;
      camera.position.set(controls.target.x + Math.sin(az2) * r2, controls.target.y + y2, controls.target.z + Math.cos(az2) * r2);
    }
    sun.position.copy(hero.pos).addScaledVector(LIGHT, 9);
    sun.target.position.copy(hero.pos);
  }
  controls.update();
  trauma = Math.max(0, trauma - real * 1.9);
  const sh = trauma * trauma * 0.09, t = performance.now() * 0.06;
  const ox = Math.sin(t * 1.3) * sh, oy = Math.sin(t * 1.9 + 1) * sh;
  camera.position.x += ox; camera.position.y += oy;
  renderer.render(scene, camera);
  camera.position.x -= ox; camera.position.y -= oy;
}
function loop() { requestAnimationFrame(loop); const d = Math.min(clock.getDelta(), 0.05); if (!window.__manual) tick(d); }
window.__tick = tick;
window.__cam = { camera, controls, scene };

function fail(e) {
  console.error(e);
  $('err').hidden = false;
  $('err').textContent = 'Não foi possível carregar o modelo. Abra esta página por um servidor local (python3 -m http.server).';
}
const loader = new GLTFLoader();
async function boot() {
  try {
    if (GLB_B64) {
      META = META_INLINE;
      const bin = atob(GLB_B64), buf = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
      loader.parse(buf.buffer, '', setup, fail);
    } else {
      META = await (await fetch('hero.meta.json')).json();
      loader.load('hero.glb', setup, undefined, fail);
    }
  } catch (e) { fail(e); }
}
boot();

// ---------------------------------------------------------------------------------------------------
// input
// ---------------------------------------------------------------------------------------------------
const user = (fn) => (e) => { if (e && e.preventDefault) e.preventDefault(); if (demo) setDemo(false); fn(); };
for (const [id, what] of [['b-attack', 'attack'], ['b-dash', 'dash'], ['b-hit', 'hit']]) {
  $(id).addEventListener('pointerdown', user(() => press(what)));
  $(id).addEventListener('click', (e) => { if (e.detail === 0) user(() => press(what))(); });   // keyboard activation
}
$('b-demo').addEventListener('click', () => setDemo(!demo));
$('b-slow').addEventListener('click', () => { speed = speed === 1 ? 0.25 : 1; $('b-slow').setAttribute('aria-pressed', String(speed !== 1)); });
const MOVE = new Set(['KeyW', 'KeyA', 'KeyS', 'KeyD', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight']);
addEventListener('keydown', (e) => {
  if (e.repeat) return;
  if (MOVE.has(e.code)) { e.preventDefault(); if (demo) setDemo(false); input.keys.add(e.code); }
  else if (e.code === 'KeyJ' || e.code === 'KeyK' || e.code === 'Enter') user(() => press('attack'))(e);
  else if (e.code === 'Space' || e.code === 'ShiftLeft') user(() => press('dash'))(e);
  else if (e.code === 'KeyH') user(() => press('hit'))(e);
});
addEventListener('keyup', (e) => input.keys.delete(e.code));
addEventListener('blur', () => input.keys.clear());
{
  const stick = $('stick'), knob = $('knob');
  let id = null;
  const set = (e) => {
    const r = stick.getBoundingClientRect();
    let x = (e.clientX - r.left - r.width / 2) / (r.width / 2), y = (e.clientY - r.top - r.height / 2) / (r.height / 2);
    const l = Math.hypot(x, y);
    if (l > 1) { x /= l; y /= l; }
    input.x = x; input.y = -y;
    knob.style.transform = `translate(${x * 30}px, ${y * 30}px)`;
  };
  stick.addEventListener('pointerdown', (e) => { if (demo) setDemo(false); id = e.pointerId; stick.setPointerCapture(id); set(e); });
  stick.addEventListener('pointermove', (e) => { if (e.pointerId === id) set(e); });
  const end = (e) => { if (e.pointerId === id) { id = null; input.x = input.y = 0; knob.style.transform = ''; } };
  stick.addEventListener('pointerup', end);
  stick.addEventListener('pointercancel', end);
}
if (matchMedia('(prefers-reduced-motion: reduce)').matches) setDemo(false);
loop();
</script>
