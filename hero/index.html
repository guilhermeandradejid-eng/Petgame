<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--PAGE-->
<title>Kael, o Espadachim</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
/* Layout: one-screen stage. The 3D hero owns the frame; a JRPG command menu sits on the bottom edge. */
:root {
  color-scheme: dark;
  --night: #1b1740;        /* sky top */
  --dusk: #6a4c93;         /* sky middle */
  --horizon: #f2a7a0;      /* sky bottom / fog */
  --panel: rgba(20, 17, 52, 0.82);
  --panel-line: #f6f1dc;   /* cream menu border, from the tunic */
  --ink: #f6f1dc;
  --ink-dim: #b9b2d6;
  --scarf: #e0282e;        /* accent, from the scarf */
  --gold: #ffc23a;
  --display: "Dela Gothic One", "Arial Black", Impact, sans-serif;
  --body: "M PLUS Rounded 1c", "Trebuchet MS", "Segoe UI", sans-serif;
}
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; background: var(--night); color: var(--ink);
  font-family: var(--body); font-weight: 500; font-size: 14px;
}
#stage {
  position: relative; height: 100%;
  background: linear-gradient(180deg, var(--night) 0%, var(--dusk) 46%, var(--horizon) 74%, var(--horizon) 100%);
}
#stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.hud {
  position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: flex-start;
  gap: 12px; padding-block: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}
.name h1 { font-family: var(--display); font-weight: 400; font-size: clamp(26px, 5vw, 44px); line-height: 1; margin: 0;
  letter-spacing: 0.02em; text-shadow: 0 3px 0 var(--scarf); }
.name p { margin: 8px 0 0; color: var(--ink); font-size: 13px; max-width: 30ch; text-shadow: 0 1px 2px var(--night); }
.state { text-align: right; min-width: 0; }
.state .clip { font-family: var(--display); font-size: clamp(16px, 3vw, 24px); color: var(--gold); line-height: 1.1; }
.state .meta { color: var(--ink); text-shadow: 0 1px 2px var(--night); font-size: 12px; font-variant-numeric: tabular-nums; margin-top: 4px; }
.combo { font-family: var(--display); font-size: clamp(22px, 4.5vw, 40px); color: var(--ink); margin-top: 6px;
  text-shadow: 0 3px 0 var(--scarf); opacity: 0; transform: scale(0.8); transition: opacity .25s, transform .12s; }
.combo.on { opacity: 1; transform: scale(1); }
.menu {
  position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; gap: 8px;
  padding-block: 12px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.cmds { display: flex; flex-wrap: wrap; gap: 8px; }
button, select {
  font: inherit; font-weight: 800; color: var(--ink); background: var(--panel); border: 2px solid var(--panel-line);
  border-radius: 4px; padding: 9px 14px; cursor: pointer; box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.35);
}
button kbd { font: inherit; font-weight: 500; color: var(--ink-dim); margin-left: 6px; font-size: 12px; }
button:hover { border-color: var(--gold); }
button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 rgba(0, 0, 0, 0.35); }
button:focus-visible, select:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
button.atk { background: var(--scarf); }
button[aria-pressed="true"] { background: var(--panel-line); color: var(--night); }
button[aria-pressed="true"] kbd { color: var(--dusk); }
.opts { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; color: var(--ink); font-size: 12px; }
.opts label, .opts .hint { background: var(--panel); border-radius: 4px; padding: 5px 9px; }
.opts label { display: flex; align-items: center; gap: 6px; }
.opts select { padding: 4px 8px; font-weight: 500; box-shadow: none; border-width: 1px; }
#err { position: absolute; inset: 40% 16px auto; text-align: center; color: var(--ink); }
@media (max-width: 560px) { .name p, button kbd, .hint { display: none; } button { padding: 9px 11px; } }
</style>
<!--/PAGE-->
</head>
<body>
<!--PAGE-->
<div id="stage">
  <canvas id="view" aria-label="Personagem 3D Kael animado"></canvas>
  <div class="hud">
    <div class="name">
      <h1>KAEL</h1>
      <p>Espadachim JRPG modelado e animado no Blender. Arraste para girar a câmera.</p>
    </div>
    <div class="state" aria-live="polite">
      <div class="clip" id="clip">Carregando</div>
      <div class="meta" id="meta"></div>
      <div class="combo" id="combo"></div>
    </div>
  </div>
  <div class="menu">
    <div class="cmds">
      <button id="b-attack" class="atk">Atacar<kbd>J</kbd></button>
      <button id="b-combo" class="atk">Combo x3</button>
      <button id="b-run" aria-pressed="false">Correr<kbd>W</kbd></button>
      <button id="b-dash">Esquiva<kbd>Espaço</kbd></button>
      <button id="b-hit">Levar dano<kbd>H</kbd></button>
      <button id="b-a1">Golpe 1</button>
      <button id="b-a2">Golpe 2</button>
      <button id="b-a3">Golpe 3</button>
    </div>
    <div class="opts">
      <button id="b-demo" aria-pressed="true">Demo automática</button>
      <label for="speed">Velocidade
        <select id="speed"><option value="1">1x</option><option value="0.5">0.5x</option><option value="0.2">0.2x</option></select>
      </label>
      <span class="hint">Aperte J várias vezes durante o golpe para encadear o combo.</span>
    </div>
  </div>
  <div id="err" hidden></div>
</div>
<!--/PAGE-->
<!--IMPORTMAP-->
<script type="importmap">
{ "imports": { "three": "../vendor/three.module.min.js", "three/addons/": "../vendor/jsm/" } }
</script>
<!--/IMPORTMAP-->
<!--PAGE-->
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const GLB_B64 = null; /*GLB*/
const $ = (id) => document.getElementById(id);
const canvas = $('view');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const HORIZON = 0xf2a7a0;
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(HORIZON, 9, 26);
const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);
camera.position.set(-2.6, 1.7, 5.0);
const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 0.85, 0);
controls.enableDamping = true;
controls.enablePan = false;
controls.minDistance = 2.5;
controls.maxDistance = 9;
controls.maxPolarAngle = Math.PI * 0.52;

// sky dome: horizon colour matches the fog so the floor melts into the dusk
scene.add(new THREE.Mesh(new THREE.SphereGeometry(60, 24, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  vertexShader: 'varying vec3 vD; void main(){ vD = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
  fragmentShader: 'varying vec3 vD; void main(){ float y = normalize(vD).y; vec3 h = vec3(0.949,0.655,0.627), d = vec3(0.416,0.298,0.576), n = vec3(0.106,0.09,0.251); vec3 c = mix(h, d, smoothstep(0.0, 0.22, y)); c = mix(c, n, smoothstep(0.18, 0.6, y)); gl_FragColor = vec4(c, 1.0); }',
})));
scene.add(new THREE.AmbientLight(0xffffff, 1.2));
const sun = new THREE.DirectionalLight(0xffffff, 2.6);
sun.position.set(-2.5, 6, 3.5);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -2.5, right: 2.5, top: 2.5, bottom: -2.5, near: 1, far: 14 });
scene.add(sun);

// ground: tiled floor that scrolls under the hero while running / dashing
const tile = document.createElement('canvas');
tile.width = tile.height = 128;
const g = tile.getContext('2d');
g.fillStyle = '#d98f9a'; g.fillRect(0, 0, 128, 128);
g.fillStyle = '#e59fa3'; g.fillRect(0, 0, 64, 64); g.fillRect(64, 64, 64, 64);
g.strokeStyle = 'rgba(90,50,110,.35)'; g.lineWidth = 3; g.strokeRect(0, 0, 128, 128);
const tex = new THREE.CanvasTexture(tile);
tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
tex.repeat.set(30, 30);
tex.colorSpace = THREE.SRGBColorSpace;
tex.anisotropy = 8;
const ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshBasicMaterial({ map: tex }));
ground.rotation.x = -Math.PI / 2;
scene.add(ground);
const shadow = new THREE.Mesh(new THREE.PlaneGeometry(8, 8), new THREE.ShadowMaterial({ opacity: 0.32, color: 0x2a1650 }));
shadow.rotation.x = -Math.PI / 2;
shadow.position.y = 0.002;
shadow.receiveShadow = true;
scene.add(shadow);

// cel shading + inverted-hull outline
const ramp = new THREE.DataTexture(new Uint8Array([150, 255]), 2, 1, THREE.RedFormat);
ramp.minFilter = ramp.magFilter = THREE.NearestFilter;
ramp.needsUpdate = true;
const FLAT = new Set(['white', 'dark', 'iris', 'mouth']);
const outlineMat = new THREE.MeshBasicMaterial({ color: 0x0c0818, side: THREE.BackSide });
outlineMat.onBeforeCompile = (s) => {
  s.vertexShader = s.vertexShader.replace('#include <begin_vertex>', 'vec3 transformed = position + normalize(normal) * 0.011;');
};

// sword trail
const TRAIL_MAX = 48, TRAIL_LIFE = 0.16;
const trailGeo = new THREE.BufferGeometry();
const tPos = new Float32Array(TRAIL_MAX * 18), tAlpha = new Float32Array(TRAIL_MAX * 6);
trailGeo.setAttribute('position', new THREE.BufferAttribute(tPos, 3).setUsage(THREE.DynamicDrawUsage));
trailGeo.setAttribute('alpha', new THREE.BufferAttribute(tAlpha, 1).setUsage(THREE.DynamicDrawUsage));
const trail = new THREE.Mesh(trailGeo, new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending,
  vertexShader: 'attribute float alpha; varying float vA; void main(){ vA = alpha; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
  fragmentShader: 'varying float vA; void main(){ gl_FragColor = vec4(mix(vec3(0.3,0.75,1.0), vec3(1.0), vA*vA), vA*0.85); }',
}));
trail.frustumCulled = false;
scene.add(trail);
let samples = [];

let mixer, actions = {}, weapon, cur = null, curName = '';
const ONESHOT = new Set(['Attack1', 'Attack2', 'Attack3', 'Dash', 'Hit']);
const NEXT = { Attack1: 'Attack2', Attack2: 'Attack3', Attack3: 'Attack1' };
const CANCEL = { Attack1: 13 / 30, Attack2: 12 / 30, Attack3: 22 / 30 };
const LABEL = { Idle: 'Postura de combate', Run: 'Corrida', Attack1: 'Corte lateral', Attack2: 'Corte ascendente',
  Attack3: 'Salto esmagador', Dash: 'Esquiva', Hit: 'Dano' };
let wantRun = false, queued = false, chain = 0, combo = 0, comboTimer = 0, speed = 1;
let demo = !matchMedia('(prefers-reduced-motion: reduce)').matches, demoStep = 0, demoT = 0;

function play(name, fade = 0.12) {
  const a = actions[name];
  if (!a) return;
  a.reset();
  a.setLoop(ONESHOT.has(name) ? THREE.LoopOnce : THREE.LoopRepeat, Infinity);
  a.clampWhenFinished = true;
  if (cur && cur !== a) a.crossFadeFrom(cur, fade, false);
  a.play();
  cur = a; curName = name; queued = false;
  if (name.startsWith('Attack')) { combo += 1; comboTimer = 1.2; showCombo(); }
  $('clip').textContent = LABEL[name];
}
function showCombo() {
  const el = $('combo');
  el.textContent = combo > 1 ? combo + ' HITS' : '';
  el.classList.toggle('on', combo > 1);
}
const isAttack = () => curName.startsWith('Attack');
function attack() {
  if (isAttack()) queued = true;
  else if (curName !== 'Hit') play('Attack1', 0.06);
}
function doCombo() { chain = 2; if (!isAttack()) play('Attack1', 0.06); }
function dash() { if (curName !== 'Dash') play('Dash', 0.06); }
function hit() { chain = 0; play('Hit', 0.04); }
function setRun(v) { wantRun = v; $('b-run').setAttribute('aria-pressed', String(v)); }
function setDemo(v) { demo = v; demoStep = 0; demoT = 0; $('b-demo').setAttribute('aria-pressed', String(v)); if (!v) chain = 0; }

const DEMO = [
  [() => setRun(false), 1.8], [() => setRun(true), 1.9], [() => { setRun(false); doCombo(); }, 0.7],
  [() => dash(), 0.2], [() => setRun(true), 1.2], [() => { setRun(false); play('Attack2', 0.06); }, 0.5],
  [() => hit(), 0.9], [() => play('Attack3', 0.08), 0.6],
];

function logic(dt) {
  if (ONESHOT.has(curName)) {
    const t = cur.time, d = cur.getClip().duration;
    if (isAttack() && chain > 0 && !queued) { queued = true; chain -= 1; }
    if (isAttack() && queued && t >= CANCEL[curName]) play(NEXT[curName], 0.07);
    else if (t >= d - 1e-3) play(wantRun ? 'Run' : 'Idle', 0.16);
  } else if (wantRun !== (curName === 'Run')) play(wantRun ? 'Run' : 'Idle', 0.18);
  if (!isAttack() && comboTimer > 0) { comboTimer -= dt; if (comboTimer <= 0) { combo = 0; showCombo(); } }
  if (demo && !ONESHOT.has(curName)) {
    demoT -= dt;
    if (demoT <= 0) { const [fn, wait] = DEMO[demoStep % DEMO.length]; demoStep += 1; demoT = wait; fn(); }
  }
  // ground scroll speed (character faces +Z)
  let v = 0;
  if (curName === 'Run') v = 4.6 * cur.getEffectiveWeight();
  if (curName === 'Dash') { const u = cur.time / cur.getClip().duration; v = 11 * Math.max(0, Math.sin(Math.PI * Math.min(u * 1.5, 1))); }
  tex.offset.y -= v * dt * 0.5;
}

const A = new THREE.Vector3(), B = new THREE.Vector3(), lastTip = new THREE.Vector3();
let now = 0;
function sampleTrail(h) {
  weapon.updateWorldMatrix(true, false);
  A.set(0, 0.2, 0).applyMatrix4(weapon.matrixWorld);
  B.set(0, 0.87, 0).applyMatrix4(weapon.matrixWorld);
  const v = B.distanceTo(lastTip) / Math.max(h, 1e-4);
  lastTip.copy(B);
  const on = isAttack() && v > 7;
  const last = samples[samples.length - 1];
  if (on) samples.push({ a: A.clone(), b: B.clone(), t: now, brk: !last || last.off });
  else if (last) last.off = true;
}
function buildTrail() {
  samples = samples.filter((s) => now - s.t < TRAIL_LIFE).slice(-TRAIL_MAX);
  let n = 0;
  for (let i = 1; i < samples.length; i++) {
    const p = samples[i - 1], q = samples[i];
    if (q.brk) continue;
    const fp = 1 - (now - p.t) / TRAIL_LIFE, fq = 1 - (now - q.t) / TRAIL_LIFE;
    const quad = [[p.a, fp * 0.15], [p.b, fp], [q.b, fq], [p.a, fp * 0.15], [q.b, fq], [q.a, fq * 0.15]];
    for (const [pt, al] of quad) { tPos.set([pt.x, pt.y, pt.z], n * 3); tAlpha[n] = Math.max(al, 0); n += 1; }
  }
  trailGeo.setDrawRange(0, n);
  trailGeo.attributes.position.needsUpdate = true;
  trailGeo.attributes.alpha.needsUpdate = true;
}

function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== Math.floor(w * renderer.getPixelRatio()) || canvas.height !== Math.floor(h * renderer.getPixelRatio())) {
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.fov = w < h ? 44 : 32;
    camera.updateProjectionMatrix();
  }
}
const clock = new THREE.Clock();
let model;
function frame() {
  requestAnimationFrame(frame);
  resize();
  const dt = Math.min(clock.getDelta(), 0.05) * speed;
  if (mixer) {
    logic(dt);
    const SUB = 4;
    for (let i = 0; i < SUB; i++) {
      mixer.update(dt / SUB);
      now += dt / SUB;
      model.updateMatrixWorld(true);
      sampleTrail(dt / SUB);
    }
    buildTrail();
    $('meta').textContent = curName + '  ' + String(Math.floor(cur.time * 30)).padStart(2, '0') + 'f';
  }
  controls.update();
  renderer.render(scene, camera);
}

function setup(gltf) {
  model = gltf.scene;
  const outlines = [];
  model.traverse((o) => {
    if (!o.isSkinnedMesh) return;
    o.frustumCulled = false;
    o.castShadow = true;
    const src = o.material, name = src.name;
    if (FLAT.has(name)) o.material = new THREE.MeshBasicMaterial({ color: src.color });
    else {
      o.material = new THREE.MeshToonMaterial({ color: src.color, gradientMap: ramp, side: THREE.DoubleSide });
      if (name === 'steel') { o.material.emissive.set(0x2a6fb0); o.material.emissiveIntensity = 0.6; }
    }
    outlines.push(o);
  });
  for (const o of outlines) {
    const ol = new THREE.SkinnedMesh(o.geometry, outlineMat);
    ol.bind(o.skeleton, o.bindMatrix);
    ol.frustumCulled = false;
    o.parent.add(ol);
  }
  scene.add(model);
  weapon = model.getObjectByName('weapon');
  mixer = new THREE.AnimationMixer(model);
  for (const clip of gltf.animations) actions[clip.name] = mixer.clipAction(clip);
  play('Idle', 0);
  window.__hero = { play, actions, mixer, setDemo, get state() { return curName; } };
}
function fail(e) {
  console.error(e);
  $('err').hidden = false;
  $('err').textContent = 'Não foi possível carregar o modelo. Abra esta página por um servidor local (ex.: python3 -m http.server).';
}
const loader = new GLTFLoader();
if (GLB_B64) {
  const bin = atob(GLB_B64), buf = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  loader.parse(buf.buffer, '', setup, fail);
} else loader.load('hero.glb', setup, undefined, fail);

const user = (fn) => () => { if (demo) setDemo(false); fn(); };
$('b-attack').onclick = user(attack);
$('b-combo').onclick = user(doCombo);
$('b-run').onclick = user(() => setRun(!wantRun));
$('b-dash').onclick = user(dash);
$('b-hit').onclick = user(hit);
$('b-a1').onclick = user(() => play('Attack1', 0.06));
$('b-a2').onclick = user(() => play('Attack2', 0.06));
$('b-a3').onclick = user(() => play('Attack3', 0.06));
$('b-demo').onclick = () => { setDemo(!demo); if (!demo) setRun(false); };
$('speed').onchange = (e) => { speed = Number(e.target.value); };
const RUNKEYS = new Set(['KeyW', 'KeyA', 'KeyS', 'KeyD', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight']);
addEventListener('keydown', (e) => {
  if (e.repeat || e.target.tagName === 'SELECT') return;
  if (e.code === 'KeyJ' || e.code === 'KeyK') user(attack)();
  else if (e.code === 'Space') { e.preventDefault(); user(dash)(); }
  else if (e.code === 'KeyH') user(hit)();
  else if (RUNKEYS.has(e.code)) user(() => setRun(true))();
});
addEventListener('keyup', (e) => { if (RUNKEYS.has(e.code)) setRun(false); });
frame();
</script>
<!--/PAGE-->
</body>
</html>
