// post: bloom on anything brighter than white (blade glow, slash arcs, sparks), then output transform

// ---------------------------------------------------------------------------------------------------
// toon shading: painted base colour, N.L step into a hue-shifted shadow, rim light, inverted-hull line
// ---------------------------------------------------------------------------------------------------
const TOON_VERT = `
#include <common>
#include <skinning_pars_vertex>
varying vec3 vN; varying vec3 vV; varying vec2 vUv; varying float vY;
void main() {
  vUv = uv;
  #include <skinbase_vertex>
  #include <beginnormal_vertex>
  #include <skinnormal_vertex>
  #include <begin_vertex>
  #include <skinning_vertex>
  vec4 wp = modelMatrix * vec4(transformed, 1.0);
  vN = normalize(mat3(modelMatrix) * objectNormal);
  vV = cameraPosition - wp.xyz;

const TOON_FRAG = `
uniform vec3 uBase, uTint, uLight; uniform sampler2D map; uniform vec2 uUvOff; uniform float uFlash, uGlow, uTex;
varying vec3 vN; varying vec3 vV; varying vec2 vUv; varying float vY;
void main() {
  vec3 N = normalize(vN), V = normalize(vV), L = normalize(uLight);
  float ndl = dot(N, L), ndv = max(dot(N, V), 0.0);
  vec3 base = uTex > 0.5 ? texture2D(map, vUv + uUvOff).rgb : uBase;
  vec3 shade = base * uTint;
  #ifdef K_FACE
    float lit = smoothstep(-0.32, -0.26, ndl);
  #elif defined(K_METAL)
    float lit = smoothstep(0.20, 0.24, ndl * 0.6 + ndv * 0.4);
  #else
    float lit = smoothstep(0.02, 0.06, ndl);
  #endif
  vec3 col = mix(shade, base, lit);
  #ifdef K_METAL
    col = mix(col, vec3(1.0), smoothstep(0.93, 0.95, dot(N, normalize(L + V))) * 0.85);
  #endif
  #ifndef K_FACE
    float rim = smoothstep(0.66, 0.72, 1.0 - ndv) * smoothstep(0.0, 0.35, ndl) * 0.45;
    col = col + (vec3(1.0) - col) * rim;
    col *= mix(0.88, 1.0, smoothstep(0.0, 0.75, vY));          // grounded: a touch darker towards the feet
  #endif
  #ifdef K_GLOW
    col = uBase * uGlow;
  #endif
  col = mix(col, vec3(1.02, 1.06, 1.06), uFlash * 0.85);
  gl_FragColor = vec4(col, 1.0);
  #include <colorspace_fragment>
}`;
const LINE_VERT = `
#include <common>
#include <skinning_pars_vertex>
attribute vec3 onormal; uniform float uWidth;
void main() {
  #include <skinbase_vertex>
  vec3 objectNormal = onormal;
  #include <skinnormal_vertex>
  #include <begin_vertex>
  #include <skinning_vertex>
  vec4 wp = modelMatrix * vec4(transformed, 1.0);
  vec3 n = normalize(mat3(modelMatrix) * objectNormal);
  wp.xyz += n * uWidth * clamp(distance(cameraPosition, wp.xyz) / 5.0, 0.55, 2.4);
  gl_Position = projectionMatrix * viewMatrix * wp;

const LINE_FRAG = `uniform vec3 uLine; void main() { gl_FragColor = vec4(uLine, 1.0);
  #include <colorspace_fragment>
}`;
const col3 = (c) => new THREE.Color().setRGB(c[0], c[1], c[2], THREE.SRGBColorSpace);
const LINE_W = { face: 0.0016, skin: 0.0026, hair: 0.0028 };
const glowMats = [];

function toonMat(spec, map) {

    defines: defs, vertexShader: TOON_VERT, fragmentShader: TOON_FRAG,
    uniforms: { uBase: { value: col3(spec.base) }, uTint: { value: new V3(tint[0], tint[1], tint[2]) }, uLight: { value: LIGHT },
      map: { value: map || null }, uTex: { value: map ? 1 : 0 }, uUvOff: { value: new THREE.Vector2() },

    const a = acc.get(k) || [0, 0, 0];
    a[0] += n.getX(i); a[1] += n.getY(i); a[2] += n.getZ(i);

    out[i * 3] = a[0] / l; out[i * 3 + 1] = a[1] / l; out[i * 3 + 2] = a[2] / l;

// ---------------------------------------------------------------------------------------------------
// world: sky, meadow, standing stones, training dummies
// ---------------------------------------------------------------------------------------------------
scene.add(new THREE.Mesh(new THREE.SphereGeometry(140, 24, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  vertexShader: 'varying vec3 vD; void main(){ vD = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
  fragmentShader: `varying vec3 vD;

    float noise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);

{
  const t = document.createElement('canvas');

  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

const PROP = { stone: { base: [0.80, 0.82, 0.86], shade: [0.50, 0.52, 0.66], kind: 'toon' },
  wood: { base: [0.66, 0.44, 0.26], shade: [0.40, 0.24, 0.20], kind: 'toon' },

  red: { base: [0.86, 0.18, 0.24], shade: [0.56, 0.08, 0.22], kind: 'toon' },

}
{
  let s = 3;
  const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 11; i++) {
    const a = i / 11 * Math.PI * 2 + r() * 0.3, d = 19 + r() * 9, h = 1.8 + r() * 3.6;
    const g = prop(new THREE.CylinderGeometry(0.45 + r() * 0.3, 0.6 + r() * 0.35, h, 6), 'stone', 0.02);

const dummies = [];
function makeDummy(x, z) {
  const root = new THREE.Group(), tilt = new THREE.Group();
  root.position.set(x, 0, z);
  root.scale.setScalar(0.82);
  root.add(tilt);
  const add = (geo, kind, px, py, pz, rz = 0) => { const p = prop(geo, kind, 0.01); p.position.set(px, py, pz); p.rotation.z = rz; tilt.add(p); return p; };
  add(new THREE.CylinderGeometry(0.07, 0.09, 1.0, 8), 'wood', 0, 0.5, 0);
  add(new THREE.CapsuleGeometry(0.26, 0.42, 6, 14), 'straw', 0, 1.12, 0);
  add(new THREE.CylinderGeometry(0.045, 0.045, 1.05, 8), 'wood', 0, 1.28, 0, Math.PI / 2);
  add(new THREE.SphereGeometry(0.2, 14, 10), 'straw', 0, 1.72, 0);
  add(new THREE.TorusGeometry(0.265, 0.035, 8, 20), 'red', 0, 1.18, 0).rotation.x = Math.PI / 2;
  add(new THREE.CylinderGeometry(0.15, 0.15, 0.03, 20), 'white', 0, 1.15, 0.27).rotation.x = Math.PI / 2;
  add(new THREE.CylinderGeometry(0.07, 0.07, 0.035, 16), 'red', 0, 1.15, 0.285).rotation.x = Math.PI / 2;
  const base = prop(new THREE.CylinderGeometry(0.28, 0.34, 0.1, 10), 'wood', 0.01);
  base.position.y = 0.05;
  root.add(base);
  scene.add(root);
  const mats = [];
  tilt.traverse((o) => { if (o.material && o.material.uniforms.uFlash) mats.push(o.material); });
  const d = { root, tilt, pos: root.position, ax: 0, az: 0, vx: 0, vz: 0, flash: 0, mats, sq: 0, vsq: 0, shake: 0, spin: 0, vspin: 0,

makeDummy(0.4, 4.4); makeDummy(-4.2, 8.2); makeDummy(4.4, 9.4); makeDummy(0.2, 14.0);

// ---------------------------------------------------------------------------------------------------
// VFX
// ---------------------------------------------------------------------------------------------------
const ADD = { transparent: true, depthWrite: false, blending: THREE.AdditiveBlending };
// sword trail: a ribbon swept by the blade, white-hot at the edge, eroding as it ages
const TRAIL_MAX = 72, TRAIL_LIFE = 0.19;
const trailGeo = new THREE.BufferGeometry();

    hero.flash = Math.max(0, hero.flash - real * 6);
    for (const m of heroMats) m.uniforms.uFlash.value = hero.flash * 0.7;
    $('meta').textContent = hero.state + '  ' + String(Math.floor(frame())).padStart(2, '0') + 'f  ·  60 fps';
    tmp.set(hero.pos.x, 0.95, hero.pos.z).sub(camT).multiplyScalar(1 - Math.exp(-real * 9));
    camT.add(tmp); camera.position.add(tmp); controls.target.copy(camT);
    if (demo) {      // demo camera: side-on and slightly behind, so hero and target both stay in frame
      const d = dummies[pilot.target % dummies.length];
      const want = Math.atan2(d.pos.x - hero.pos.x, d.pos.z - hero.pos.z) + (camera.aspect < 1 ? 2.75 : 2.25);    // portrait: more behind the hero
      const off = new V3().subVectors(camera.position, controls.target);
      const az = Math.atan2(off.x, off.z), r = Math.hypot(off.x, off.z), k = 1 - Math.exp(-real * 1.25);
      const az2 = az + angDiff(want, az) * k, r2 = r + (4.4 - r) * k, y2 = off.y + (1.0 - off.y) * k;
      camera.position.set(controls.target.x + Math.sin(az2) * r2, controls.target.y + y2, controls.target.z + Math.cos(az2) * r2);
    }
    sun.position.copy(hero.pos).addScaledVector(LIGHT, 9);
    sun.target.position.copy(hero.pos);
  }
  controls.update();
  trauma = Math.max(0, trauma - real * 1.8);
  kick = Math.max(0, kick - real * 14 * Math.max(kick, 0.4));
  camera.fov = (canvas.clientWidth < canvas.clientHeight ? 46 : BASE_FOV) - kick;
  if (window.__shot) window.__shot(camera, kick);       // capture rigs may override the camera
  camera.updateProjectionMatrix();
  const sh = trauma * trauma * 0.11, t = wall * 60;
  const ox = Math.sin(t * 1.3) * sh, oy = Math.sin(t * 1.9 + 1) * sh;
  camera.position.x += ox; camera.position.y += oy;
  if (window.__skip) { /* capture rigs fast-forward without drawing */ } else if (composer) composer.render(); else renderer.render(scene, camera);
  camera.position.x -= ox; camera.position.y -= oy;
  if (composer && !window.__manual) {       // drop the bloom pass on devices that cannot afford it
    slowFrames = real > 0.034 ? slowFrames + 1 : Math.max(0, slowFrames - 2);
    if (slowFrames > 90) { composer = null; renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5)); }
  }
}
function loop() { requestAnimationFrame(loop); const d = Math.min(clock.getDelta(), 0.05); if (!window.__manual) tick(d); }
window.__tick = tick;
window.__cam = { camera, controls, scene };

function fail(e) {
  console.error(e);
  $('err').hidden = false;
  $('err').textContent = 'Não foi possível carregar o modelo. Abra esta página por um servidor local (python3 -m http.server).';
}
const loader = new GLTFLoader();
async function boot() {
  try {
    if (GLB_B64) {
      META = META_INLINE;
      const bin = atob(GLB_B64), buf = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
      loader.parse(buf.buffer, '', setup, fail);
    } else {
      META = await (await fetch('hero.meta.json')).json();
      loader.load('hero.glb', setup, undefined, fail);
    }
  } catch (e) { fail(e); }
}
boot();

// ---------------------------------------------------------------------------------------------------
// input
// ---------------------------------------------------------------------------------------------------
const user = (fn) => (e) => { if (e && e.preventDefault) e.preventDefault(); audioInit(); if (demo) setDemo(false); fn(); };
for (const [id, what] of [['b-attack', 'attack'], ['b-dash', 'dash'], ['b-hit', 'hit']]) {
  $(id).addEventListener('pointerdown', user(() => press(what)));
  $(id).addEventListener('click', (e) => { if (e.detail === 0) user(() => press(what))(); });   // keyboard activation
}
$('b-demo').addEventListener('click', () => { audioInit(); setDemo(!demo); });
$('b-slow').addEventListener('click', () => { audioInit(); speed = speed === 1 ? 0.25 : 1; $('b-slow').setAttribute('aria-pressed', String(speed !== 1)); });
$('b-snd').addEventListener('click', () => { sndOn = !sndOn; $('b-snd').setAttribute('aria-pressed', String(sndOn)); if (sndOn) audioInit(); });
canvas.addEventListener('pointerdown', () => audioInit());
const MOVE = new Set(['KeyW', 'KeyA', 'KeyS', 'KeyD', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight']);
addEventListener('keydown', (e) => {
  if (e.repeat) return;
  if (MOVE.has(e.code)) { e.preventDefault(); audioInit(); if (demo) setDemo(false); input.keys.add(e.code); }
  else if (e.code === 'KeyJ' || e.code === 'KeyK' || e.code === 'Enter') user(() => press('attack'))(e);
  else if (e.code === 'Space' || e.code === 'ShiftLeft') user(() => press('dash'))(e);
  else if (e.code === 'KeyH') user(() => press('hit'))(e);
});
addEventListener('keyup', (e) => input.keys.delete(e.code));
addEventListener('blur', () => input.keys.clear());
{
  const stick = $('stick'), knob = $('knob');
  let id = null;
  const set = (e) => {
    const r = stick.getBoundingClientRect();
    let x = (e.clientX - r.left - r.width / 2) / (r.width / 2), y = (e.clientY - r.top - r.height / 2) / (r.height / 2);
    const l = Math.hypot(x, y);
    if (l > 1) { x /= l; y /= l; }
    input.x = x; input.y = -y;
    knob.style.transform = `translate(${x * 30}px, ${y * 30}px)`;
  };
  stick.addEventListener('pointerdown', (e) => { audioInit(); if (demo) setDemo(false); id = e.pointerId; stick.setPointerCapture(id); set(e); });
  stick.addEventListener('pointermove', (e) => { if (e.pointerId === id) set(e); });
  const end = (e) => { if (e.pointerId === id) { id = null; input.x = input.y = 0; knob.style.transform = ''; } };
  stick.addEventListener('pointerup', end);
  stick.addEventListener('pointercancel', end);
}
if (matchMedia('(prefers-reduced-motion: reduce)').matches) setDemo(false);
loop();
</script>
